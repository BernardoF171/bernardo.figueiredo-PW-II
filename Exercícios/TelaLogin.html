<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro de Funcionários</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="topo">
      <h2>Cadastro de Funcionários</h2>

      <button class="btn-incluir" onclick="abrirModal()">
        Incluir
      </button>
    </div>

    <table>

      <thead>
        <tr>
          <th>Nome</th>
          <th>Função</th>
          <th>Salário</th>
          <th>Editar</th>
          <th>Excluir</th>
        </tr>
      </thead>

      <tbody id="tabela">
      </tbody>

    </table>

  </div>

  <div class="overlay hidden" id="overlay">

    <div class="modal">

      <div class="campo">

        <label>Nome</label>

        <input
          type="text"
          id="nome"
        >

        <div class="mensagem-erro" id="erroNome">
          ⚠ Preencha este campo.
        </div>

      </div>

      <div class="campo">

        <label>Função</label>

        <input
          type="text"
          id="funcao"
        >

        <div class="mensagem-erro" id="erroFuncao">
          ⚠ Preencha este campo.
        </div>

      </div>

      <div class="campo">

        <label>Salário</label>

        <input
          type="text"
          id="salario"
        >

        <div class="mensagem-erro" id="erroSalario">
          ⚠ Preencha este campo.
        </div>

      </div>

      <button class="btn-salvar" onclick="salvarFuncionario()">
        Salvar
      </button>

    </div>

  </div>

  <script src="Js/JavaLogin.js"></script>

</body>
</html>
